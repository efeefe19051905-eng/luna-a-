
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101a;color:#f5f3ff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:850px;height:100vh;display:flex;flex-direction:column;padding:20px}
header{text-align:center;padding:22px;border-bottom:1px solid #302b43}
header h1{margin:0;color:#c7a5ff;font-size:30px}
header p{color:#aaa2bd;margin-bottom:0}
#messages{flex:1;overflow-y:auto;padding:20px 5px}
.msg{padding:13px 16px;border-radius:16px;margin:12px 0;max-width:85%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#6846a8;margin-left:auto}
.bot{background:#252338;margin-right:auto}
form{display:flex;gap:10px;padding:12px 0}
input{flex:1;min-width:0;padding:16px;border-radius:12px;border:1px solid #49415f;background:#201e30;color:white;font-size:16px}
button{padding:0 22px;border:0;border-radius:12px;background:#a77aff;color:#171020;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header>
<h1>☾ Luna AI</h1>
<p>Seninle konuşmaya hazırım.</p>
</header>
<div id="messages">
<div class="msg bot">Merhaba! Ben Luna. Bugün ne hakkında konuşmak istersin?</div>
</div>
<form id="chatForm">
<input id="prompt" placeholder="Luna'ya bir mesaj yaz..." autocomplete="off" required>
<button id="send" type="submit">Gönder</button>
</form>
</div>
<script>
const form=document.getElementById("chatForm");
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const send=document.getElementById("send");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 addMessage("Luna hazırlanıyor...","bot");
});
</script>
</body>
</html>
